<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="potentialu-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9ad76" />
      <stop offset="50%" stop-color="#a78f61" />
      <stop offset="100%" stop-color="#806840" />
    </linearGradient>
  </defs>

  <!-- Deep Navy Background matching PotentialU Brand (#001F55) -->
  <rect width="512" height="512" rx="104" fill="#001F55" />

  <!-- Official Stylized Golden U Mark -->
  <!-- Left Dot -->
